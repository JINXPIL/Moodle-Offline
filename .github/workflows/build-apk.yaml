# Сборка приложения для Android (MoodleOffline.apk) на серверах GitHub и проверка его в эмуляторе.
#  • В pull request (если менялись android-app/, *.py или ui/) и вручную (Actions → build-apk → Run workflow): собирает apk,
#    ставит его в эмулятор Android, запускает самопроверку, снимает экран. apk и снимки — в артефактах запуска.
#  • По тегу v*: то же самое + apk (и контрольная сумма SHA-256) выкладываются в Releases рядом с MoodleOffline.exe.
# Подпись: ключ берётся из секретов репозитория (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS) — как его
# создать, см. android-app/make_keystore.py. Без секретов apk подписывается временным ключом: ставится, но обновить поверх нельзя.
name: build-apk
on:
  workflow_dispatch:
  pull_request:
    paths: ["android-app/**", "*.py", "ui/**", ".github/workflows/build-apk.yaml"]
  push:
    tags: ["v*"]
permissions:
  contents: write   # нужно, чтобы приложить apk к релизу
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5      # Chaquopy ставит библиотеки Python при сборке
        with:
          python-version: "3.13"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Ключ подписи
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "Ключ подписи: из секретов репозитория"
          else
            echo "::warning::Секрет ANDROID_KEYSTORE_BASE64 не задан: apk подписан временным ключом, обновить приложение поверх нельзя (см. android-app/make_keystore.py)"
          fi
      - name: Сборка apk
        working-directory: android-app
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Подготовить файлы
        run: |
          mkdir out
          cp android-app/app/build/outputs/apk/release/app-release.apk out/MoodleOffline.apk
          (cd out && sha256sum MoodleOffline.apk > MoodleOffline.apk.sha256 && cat MoodleOffline.apk.sha256 && ls -l)
      - uses: actions/upload-artifact@v4
        with:
          name: MoodleOffline-apk
          path: out/*

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MoodleOffline-apk
          path: out
      - name: Включить KVM (быстрый эмулятор)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Эмулятор Android 14, самопроверка и снимки экрана
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android-app/ci/smoke.sh out/MoodleOffline.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-result
          path: smoke-out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MoodleOffline-apk
          path: out
      - name: Выложить в Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd out
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" MoodleOffline.apk MoodleOffline.apk.sha256 --clobber
          else
            # релиз ещё не создан (его может создавать и сборка exe одновременно с этой): создаём или, если опередили, просто добавляем файлы
            gh release create "$GITHUB_REF_NAME" MoodleOffline.apk MoodleOffline.apk.sha256 --title "Moodle Offline $GITHUB_REF_NAME" --generate-notes \
              || gh release upload "$GITHUB_REF_NAME" MoodleOffline.apk MoodleOffline.apk.sha256 --clobber
          fi
