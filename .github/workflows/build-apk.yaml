# Сборка приложения для Android на серверах GitHub и проверка его в эмуляторе. Четыре файла под разные процессоры:
#    MoodleOffline.apk             — универсальный: любой телефон (ARM 32/64 бит, x86), Python 3.11
#    MoodleOffline-arm64-v8a.apk   — современные 64-битные телефоны (почти все с 2017 года), Python 3.13, самый маленький
#    MoodleOffline-armeabi-v7a.apk — старые 32-битные ARM-телефоны, Python 3.11
#    MoodleOffline-x86_64.apk      — эмуляторы и ChromeOS, Python 3.13
#  (32-битные процессоры есть в Chaquopy только с Python 3.11 и старше — подробности в android-app/app/build.gradle.kts.)
#  • В pull request (если менялись android-app/, *.py или ui/) и вручную (Actions → build-apk → Run workflow): собирает все четыре apk,
#    проверяет подпись и состав процессоров в каждом, ставит x86_64- и универсальный apk в эмулятор Android, запускает самопроверку,
#    снимает экран. apk и снимки — в артефактах запуска.
#  • По тегу v*: то же самое + apk (и контрольные суммы SHA-256) выкладываются в Releases рядом с MoodleOffline.exe.
# Подпись: ключ берётся из секретов репозитория (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS) — как его
# создать, см. android-app/make_keystore.py. Без секретов apk подписывается временным ключом: ставится, но обновить поверх нельзя.
name: build-apk
on:
  workflow_dispatch:
  pull_request:
    paths: ["android-app/**", "*.py", "ui/**", ".github/workflows/build-apk.yaml"]
  push:
    tags: ["v*"]
permissions:
  contents: write   # нужно, чтобы приложить apk к релизу
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - name: Версия из тега (чтобы тег и версия внутри файла не расходились)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          if ! echo "$ver" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then echo "::error::Тег $GITHUB_REF_NAME не похож на версию (нужно v1.2.3)"; exit 1; fi
          sed -i -E "s/^VERSION = \".*\"/VERSION = \"$ver\"/" moodle_offline.py
          grep -n '^VERSION = ' moodle_offline.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5      # Chaquopy ставит библиотеки Python при сборке и ищет python той же версии, что в приложении (3.13 и 3.11)
        with:
          python-version: |
            3.11
            3.13
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Ключ подписи
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "KEY_KIND=постоянный ключ из секретов репозитория" >> "$GITHUB_ENV"
            echo "Ключ подписи: из секретов репозитория"
          else
            # Секретов нет (например, pull request из чужого форка или ключ ещё не заведён): делаем одноразовый ключ тем же скриптом
            # и тем же путём, что и настоящий — так подпись проверяется в каждой сборке. Значения не печатаем.
            echo "::warning::Секрет ANDROID_KEYSTORE_BASE64 не задан: apk подписан одноразовым ключом, обновить приложение поверх нельзя (см. android-app/make_keystore.py)"
            pip install --quiet cryptography
            python android-app/make_keystore.py --dir "$RUNNER_TEMP/tmpkey" --secrets-file "$RUNNER_TEMP/tmpkey/s.txt" > /dev/null
            pw=$(grep '^ANDROID_KEYSTORE_PASSWORD=' "$RUNNER_TEMP/tmpkey/s.txt" | cut -d= -f2-)
            echo "::add-mask::$pw"
            {
              echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/tmpkey/moodle-offline.p12"
              echo "ANDROID_KEYSTORE_PASSWORD=$pw"
              echo "ANDROID_KEY_ALIAS=moodle-offline"
              echo "KEY_KIND=одноразовый ключ (секреты не заданы)"
            } >> "$GITHUB_ENV"
          fi
      - name: Сборка apk (все варианты)
        working-directory: android-app
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Подготовить файлы и проверить состав процессоров
        run: |
          mkdir out
          B=android-app/app/build/outputs/apk
          cp "$B/universal/release/app-universal-release.apk" out/MoodleOffline.apk
          cp "$B/arm64/release/app-arm64-release.apk"         out/MoodleOffline-arm64-v8a.apk
          cp "$B/arm32/release/app-arm32-release.apk"         out/MoodleOffline-armeabi-v7a.apk
          cp "$B/x64/release/app-x64-release.apk"             out/MoodleOffline-x86_64.apk
          # в каждом файле должны лежать ровно те процессоры, что заявлены (иначе установка на нужный телефон не пойдёт)
          fail=0
          check() {  # файл, ожидаемый список папок lib/ через пробел
            got=$(unzip -Z1 "out/$1" | grep -oE '^lib/[^/]+/' | sed 's#lib/##; s#/##' | sort -u | tr '\n' ' ' | sed 's/ $//')
            if [ "$got" = "$2" ]; then echo "OK   $1: $got"; else echo "::error::$1: процессоры [$got], ожидались [$2]"; fail=1; fi
          }
          check MoodleOffline.apk "arm64-v8a armeabi-v7a x86 x86_64"
          check MoodleOffline-arm64-v8a.apk "arm64-v8a"
          check MoodleOffline-armeabi-v7a.apk "armeabi-v7a"
          check MoodleOffline-x86_64.apk "x86_64"
          [ "$fail" = 0 ] || exit 1
      - name: Проверка подписи apk
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in out/*.apk; do
            echo "== $f"
            "$APKSIGNER" verify --verbose --print-certs "$f" | grep -E "Verifies|Verified using|certificate (DN|SHA-256)"
          done
          echo "Ключ: $KEY_KIND. Отпечаток SHA-256 должен быть одним и тем же у всех файлов (и в каждой сборке, если ключ постоянный) — иначе один вариант не встанет поверх другого."
          n=$(for f in out/*.apk; do "$APKSIGNER" verify --print-certs "$f" | grep 'certificate SHA-256'; done | sort -u | wc -l)
          if [ "$n" != 1 ]; then echo "::error::у вариантов apk разные подписи"; exit 1; fi
      - name: Контрольные суммы
        run: |
          cd out
          for f in *.apk; do sha256sum "$f" > "$f.sha256"; done
          cat *.sha256; ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: MoodleOffline-apk
          path: out/*

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15   # обычно 3–5 минут; если эмулятор завис, не ждём 40 минут
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64-вариант: Python 3.13 (так же собран arm64-вариант, для которого эмулятор ARM недоступен)
          - { name: x64, apk: MoodleOffline-x86_64.apk, py: "3.13" }
          # универсальный: Python 3.11 — тот же Python и тот же код, что в 32-битном варианте armeabi-v7a
          - { name: universal, apk: MoodleOffline.apk, py: "3.11" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MoodleOffline-apk
          path: out
      - name: Включить KVM (быстрый эмулятор)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Эмулятор Android 14, самопроверка и снимки экрана
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: EXPECT_PY=${{ matrix.py }} bash android-app/ci/smoke.sh out/${{ matrix.apk }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-result-${{ matrix.name }}
          path: smoke-out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MoodleOffline-apk
          path: out
      - name: Выложить в Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd out
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" *.apk *.sha256 --clobber
          else
            # релиз ещё не создан (его может создавать и сборка exe одновременно с этой): создаём или, если опередили, просто добавляем файлы
            gh release create "$GITHUB_REF_NAME" *.apk *.sha256 --title "Moodle Offline $GITHUB_REF_NAME" --generate-notes \
              || gh release upload "$GITHUB_REF_NAME" *.apk *.sha256 --clobber
          fi
