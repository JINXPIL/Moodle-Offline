# Сборка MoodleOffline.exe на серверах GitHub.
#  • Вручную: вкладка Actions → build-exe → Run workflow → артефакт MoodleOffline-windows (хранится ограниченное время).
#  • По тегу v* (например, v1.1.2): то же самое + exe выкладывается в раздел Releases вместе с контрольной суммой SHA-256.
name: build-exe
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write   # нужно, чтобы создать релиз и приложить к нему exe
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Версия из тега (чтобы тег и версия внутри файла не расходились)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          if ! echo "$ver" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then echo "::error::Тег $GITHUB_REF_NAME не похож на версию (нужно v1.2.3)"; exit 1; fi
          sed -i -E "s/^VERSION = \".*\"/VERSION = \"$ver\"/" moodle_offline.py
          grep -n '^VERSION = ' moodle_offline.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name MoodleOffline --add-data "ui;ui" gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: MoodleOffline-windows
          path: dist/MoodleOffline.exe
      - name: Выложить в Releases (только для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum MoodleOffline.exe > MoodleOffline.exe.sha256
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # релиз с таким тегом уже создан вручную на сайте: просто добавляем файлы
            gh release upload "$GITHUB_REF_NAME" MoodleOffline.exe MoodleOffline.exe.sha256 --clobber
          else
            # релиз могут создавать и соседние сборки (apk, Linux, macOS) одновременно: опередили — просто добавляем файлы
            gh release create "$GITHUB_REF_NAME" MoodleOffline.exe MoodleOffline.exe.sha256 \
              --title "Moodle Offline $GITHUB_REF_NAME" --generate-notes \
              || gh release upload "$GITHUB_REF_NAME" MoodleOffline.exe MoodleOffline.exe.sha256 --clobber
          fi
